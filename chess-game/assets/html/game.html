<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chess Game</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <h1 id="title">Chess Game</h1>

  <div id="game-container">
    <div id="player1-score" class="score-panel">
      Blancas<br>Puntos: <span id="score1">0</span>

    <div id="player2-score" class="score-panel">

    </div>
  </div>

  <div id="message"></div>

  <button id="reset" class="reset-button">Reset Game</button>

  <script type="module" src="../js/index.js"></script>
</body>
</html>
