<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chess Game</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <img id="title" src="/images/pawnedletraslogo.png" alt="PAWNED Logo">

  <div id="game-container">
    <div id="player1-score" class="score-panel">
      Blancas<br>
      Puntos: <span id="score1">0</span><br>
      Rondas: <span id="rounds1">0</span>
      <div id="white-powerups-display" class="powerup-inventory"></div>
    </div>

    <div id="board"></div>

    <div id="player2-score" class="score-panel">
      Negras<br>
      Puntos: <span id="score2">0</span><br>
      Rondas: <span id="rounds2">0</span>
      <div id="black-powerups-display" class="powerup-inventory"></div>
    </div>
  </div>

  <div id="message"></div>

  <button id="reset" class="reset-button image-button-game">
    <img src="/images/resetgamebutton.png" alt="Reset Game" class="game-button-image" />
  </button>

  <!-- Pause Menu Overlay -->
  <div id="pause-overlay" class="pause-overlay">
    <div class="pause-menu">
      <h2>⏸️ PAUSA</h2>
      <button id="resume-btn" class="pause-button resume">Continuar</button>
      <br>
      <button id="restart-btn" class="pause-button">Reiniciar Partida</button>
      <br>
      <button id="main-menu-btn" class="pause-button main-menu">Menú Principal</button>
    </div>
  </div>

  <script type="module" src="../js/index.js"></script>
</body>
</html>
