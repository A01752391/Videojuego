<!DOCTYPE html>
<html lang="en">
<head>  <meta charset="UTF-8">
  <title>Chess Game</title>  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/round-stats-modal.css">
  <link rel="stylesheet" href="../css/game-stats-modal.css">
</head>
<body>
  <!-- Game Start Form -->
  <div id="game-start-form" class="game-start-form">
    <div class="start-form-container">
      <img id="title-start" src="/images/pawnedletraslogo.png" alt="PAWNED Logo" class="start-logo">
      
      <h2>Iniciar Nueva Partida</h2>
      
      <div class="player-inputs">
        <div class="input-group">
          <label for="white-player">Email Jugador Blancas:</label>
          <input type="email" id="white-player" name="white-player" placeholder="jugador1@email.com" required>
        </div>
        
        <div class="input-group">
          <label for="black-player">Email Jugador Negras:</label>
          <input type="email" id="black-player" name="black-player" placeholder="jugador2@email.com" required>
        </div>
      </div>
      
      <button id="start-game-btn" class="start-button image-button">
        <img src="/images/startgame.png" alt="Iniciar Partida" class="button-image" />
      </button>
    </div>
  </div>

  <div id="main-layout" style="display: none;">
    <!-- Left side - Board -->
    <div id="board-section">
      <div id="board"></div>
    </div>    <!-- Right side - Game info -->
    <div id="info-section">      <img id="title" src="/images/pawnedletraslogo.png" alt="PAWNED Logo">
      
      <div id="message"></div>      <div id="scores-container">        <!-- Player 1 (Blancas) -->
        <div class="player-section">
          <img class="player-logo" src="/images/whitelogo.png" alt="White Player">
          <div class="player-boxes">            <div class="score-panel info-tray">
              <div class="player-info">
                <div class="player-stats">
                  <div>Puntos: <span id="score1">0</span></div>
                  <div>Rondas: <span id="rounds1">0</span></div>
                </div>
              </div>
            </div>            <div class="score-panel powerup-tray">
              <div class="powerup-label">POWER-UPS</div>
              <div id="white-powerups-display" class="powerup-inventory-vertical"></div>
            </div>
          </div>
        </div>        <!-- Player 2 (Negras) -->
        <div class="player-section">
          <img class="player-logo" src="/images/blacklogo.png" alt="Black Player">
          <div class="player-boxes">            <div class="score-panel info-tray">
              <div class="player-info">
                <div class="player-stats">
                  <div>Puntos: <span id="score2">0</span></div>
                  <div>Rondas: <span id="rounds2">0</span></div>
                </div>
              </div>
            </div>            <div class="score-panel powerup-tray">
              <div class="powerup-label">POWER-UPS</div>
              <div id="black-powerups-display" class="powerup-inventory-vertical"></div>
            </div>
          </div>
        </div>      </div><div id="buttons-container">
        <button id="reset" class="reset-button image-button-game">
          <img src="/images/resetgamebutton.png" alt="Reset Game" class="game-button-image" />
        </button>
      </div>
    </div>
  </div>

  <!-- Pause Menu Overlay -->
  <div id="pause-overlay" class="pause-overlay">
    <div class="pause-menu">
      <h2>⏸️ PAUSA</h2>
      <button id="resume-btn" class="pause-button resume">Continuar</button>
      <br>
      <button id="restart-btn" class="pause-button">Reiniciar Partida</button>
      <br>
      <button id="main-menu-btn" class="pause-button main-menu">Menú Principal</button>
    </div>
  </div>  <script src="../js/round-stats-modal.js"></script>
  <script src="../js/game-stats-modal.js"></script>
  <script src="../js/setupPowerups.js"></script>
  <script type="module" src="../js/index.js"></script>
</body>
</html>
