<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chess Game</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Formulario de inicio de partida -->
  <div id="game-start-form" class="modal">
    <div class="modal-content">
      <h2>Iniciar Partida</h2>
      <div class="player-inputs">
        <div class="player-input">
          <label for="white-player">Jugador Blancas (email):</label>
          <input type="email" id="white-player" required>
        </div>
        <div class="player-input">
          <label for="black-player">Jugador Negras (email):</label>
          <input type="email" id="black-player" required>
        </div>
      </div>
      <button id="start-game-btn">Comenzar Partida</button>
    </div>
  </div>

  <div id="main-layout" style="display: none;">
    <!-- Left side - Board -->
    <div id="board-section">
      <div id="board"></div>
    </div>    <!-- Right side - Game info -->
    <div id="info-section">
      <img id="title" src="/images/pawnedletraslogo.png" alt="PAWNED Logo">
      
      <div id="message"></div>      <div id="scores-container">        <!-- Player 1 (Blancas) -->
        <div class="player-section">
          <img class="player-logo" src="/images/whitelogo.png" alt="White Player">
          <div class="player-boxes">            <div class="score-panel info-tray">
              <div class="player-info">
                <div class="player-stats">
                  <div>Puntos: <span id="score1">0</span></div>
                  <div>Rondas: <span id="rounds1">0</span></div>
                </div>
              </div>
            </div>            <div class="score-panel powerup-tray">
              <div class="powerup-label">POWER-UPS</div>
              <div id="white-powerups-display" class="powerup-inventory-vertical"></div>
            </div>
          </div>
        </div>        <!-- Player 2 (Negras) -->
        <div class="player-section">
          <img class="player-logo" src="/images/blacklogo.png" alt="Black Player">
          <div class="player-boxes">            <div class="score-panel info-tray">
              <div class="player-info">
                <div class="player-stats">
                  <div>Puntos: <span id="score2">0</span></div>
                  <div>Rondas: <span id="rounds2">0</span></div>
                </div>
              </div>
            </div>            <div class="score-panel powerup-tray">
              <div class="powerup-label">POWER-UPS</div>
              <div id="black-powerups-display" class="powerup-inventory-vertical"></div>
            </div>
          </div>
        </div>
      </div><div id="buttons-container">
        <button id="reset" class="reset-button image-button-game">
          <img src="/images/resetgamebutton.png" alt="Reset Game" class="game-button-image" />
        </button>
      </div>
    </div>
  </div>

  <!-- Pause Menu Overlay -->
  <div id="pause-overlay" class="pause-overlay">
    <div class="pause-menu">
      <h2>⏸️ PAUSA</h2>
      <button id="resume-btn" class="pause-button resume">Continuar</button>
      <br>
      <button id="restart-btn" class="pause-button">Reiniciar Partida</button>
      <br>
      <button id="main-menu-btn" class="pause-button main-menu">Menú Principal</button>
    </div>
  </div>

  <script type="module" src="/js/index.js"></script>
</body>
</html>
