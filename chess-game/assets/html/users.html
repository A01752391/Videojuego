<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/assets/css/users.css" rel="stylesheet">
    <script type="module" src="../js/pruebasAPI.js"></script>
    <title>Usuarios</title>
</head>
<body>
    <h1>Usuarios</h1>
    <div class="main-container">
        <div class="section">
            <h2>Registrar usuario</h2>
            <div id="forma">
                <label for="newEmail">Email:</label>
                <input type="email" id="newEmail" required>

                <label for="newPassword">Contraseña:</label>
                <input type="text" id="newPassword" required>

                <button id="NewUser" type="button">Registrarse</button>
            </div> 
        </div>
        <div class="section">
            <h2>Actualizar datos</h2>
            <div id="forma">
                <label for="updatedEmail">Nuevo email:</label>
                <input type="email" id="updatedEmail">

                <label for="updatedPassword">Nueva contraseña:</label>
                <input type="text" id="updatedPassword">

                <button id="UpdateUser" type="button">Actualizar</button>
            </div> 
        </div>
        <div class="section users-info">
            <h2>Usuarios registrados</h2>
            <!-- Table with registered users -->
        </div>
    </div>
    <a href="index.html" class="back-to-main">Volver al Menú Principal</a>
</body>
</html>
