<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/assets/css/users.css" rel="stylesheet">
    <title>Users</title>
</head>
<body>
    <h1>Users</h1>
    <div class="main-container">
        <div class="section">
            <h2>Login</h2>
            <div id="forma">
                <label for="email">Email:</label>
                <input type="email" id="email">

                <label for="password">Contraseña:</label>
                <input type="text" id="password">

                <button id="NewUser" type="button">Login</button>
            </div> 
        </div>
        <div class="section">
            <h2>Actualizar datos</h2>
            <div id="forma">
                <label for="newEmail">Nuevo email:</label>
                <input type="email" id="newEmail">

                <label for="newPassword">Nueva contraseña:</label>
                <input type="text" id="newPassword">

                <button id="UpdateUser" type="button">Actualizar</button>
            </div> 
        </div>
        <div class="section users-info">
            <h2>Usuarios registrados</h2>
            <!-- Table with registered users -->
        </div>
    </div>
    <a href="index.html" class="back-to-main">Volver al Menú Principal</a>
</body>
</html>
