<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/assets/css/users.css" rel="stylesheet">
    <script type="module" src="../js/usersAPI.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> <!-- For pretty popups-->
    <title>PAWNED - Configuración de Usuarios</title>    <style>        body {
            margin: 0;
            padding: 0;
            background-image: url('/images/mainbackground.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #2c1e2e;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;            color: #ffffff;
            overflow-x: hidden;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 20px auto;
            background: #2c1e2e;
            border-radius: 20px;
            border: 3px solid #ff4081;
            box-shadow: 0 0 30px rgba(255, 64, 129, 0.5);
            padding: 30px;
            position: relative;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid #ff4081;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .logo {
            width: 150px;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 10px rgba(255, 64, 129, 0.7));
        }

        .title {
            font-size: 2.2rem;
            font-weight: bold;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            color: #ffd54f;
                    }

        .subtitle {
            color: #ff4081;
            font-size: 1.2em;
            margin-bottom: 10px;
            font-weight: 300;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }

        .section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #ffd54f;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 213, 79, 0.3);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7);
        }.formContainer {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 100%;
        }

        .formContainer div {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 100%;
        }

        .formContainer label {
            color: #ffffff;
            font-weight: 600;
            font-size: 1.1em;
        }        .formContainer input {
            padding: 12px;
            border: 2px solid #ff4081;
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.9);
            color: #2c1e2e;            font-size: 1em;
            transition: all 0.3s ease;
        }

        .formContainer input:focus {
            outline: none;
            border-color: #ffd54f;
            box-shadow: 0 0 10px rgba(255, 213, 79, 0.3);
        }        .formContainer button {
            background: linear-gradient(45deg, #ff4081, #e91e63);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 1.1em;            font-weight: bold;
            transition: all 0.3s ease;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            box-shadow: 0 3px 10px rgba(255, 64, 129, 0.3);
        }

        .formContainer button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 64, 129, 0.5);
            background: linear-gradient(45deg, #e91e63, #ff4081);
        }

        .users-info {
            border-color: #ffd54f;
        }        .navigation {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #ff4081;
        }        .nav-button {
            background-color: transparent !important;
            box-shadow: none !important;
            padding: 0 !important;
            border: none !important;
            width: 160px !important;
            height: auto !important;
            display: flex !important;
            justify-content: center !important;            align-items: center !important;            margin: 30px auto 0 !important;
            text-decoration: none;
            transition: all 0.2s ease;
            outline: none !important;
        }

        .nav-button:hover {
            background-color: transparent !important;
            box-shadow: none !important;
            transform: scale(1.05);
            outline: none !important;
        }

        .nav-button:focus {
            background-color: transparent !important;
            box-shadow: none !important;
            outline: none !important;
        }

        .nav-button:active {
            transform: scale(0.95);
            background-color: transparent !important;
            box-shadow: none !important;
            outline: none !important;
        }        .button-image {
            width: 140px;
            height: auto;
            border-radius: 10px;            filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.3));            transition: all 0.2s ease;
            display: block;
        }

        .button-image:hover {
            filter: drop-shadow(0 8px 15px rgba(0, 0, 0, 0.4)) brightness(1.1);
        }/* Responsive Design */
        @media (max-width: 768px) {
            .container {
                width: 95%;
                padding: 20px;
                margin: 10px auto;
            }

            .title {
                font-size: 1.8rem;
            }
            
            .formContainer button {
                padding: 12px 20px;
                font-size: 1em;
            }
            
            .button-image {
                width: 120px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }
            
            .title {
                font-size: 1.6rem;
            }
            
            .subtitle {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="/images/pawnedletraslogo.png" alt="PAWNED Logo" class="logo">
            <h1 class="title">CONFIGURACIÓN</h1>
            <p class="subtitle">Gestión de usuarios de PAWNED</p>
        </div>

        <div class="section">
            <h2 class="section-title">Registrar usuario</h2>
            <form id="formaSignUpUser" class="formContainer">
                <div>
                    <label for="newEmail">Email:</label>
                    <input type="email" id="newEmail" required>
                </div>

                <div>
                    <label for="newPassword">Contraseña:</label>
                    <input type="password" id="newPassword" minlength="6" required>
                </div>

                <div>
                    <button id="NewUser" type="button">Registrarse</button>
                </div>
            </form> 
        </div>

        <div class="section">
            <h2 class="section-title">Actualizar datos</h2>
            <form id="formaUpdateUser" class="formContainer">
                <div>
                    <label for="currentEmail">Email actual:</label>
                    <input type="email" id="currentEmail" required>
                </div>

                <div>
                    <label for="currentPassword">Contraseña actual:</label>
                    <input type="password" id="currentPassword" required>
                </div>

                <div>
                    <label for="updatedEmail">Nuevo email (opcional):</label>
                    <input type="email" id="updatedEmail">
                </div>

                <div>
                    <label for="updatedPassword">Nueva contraseña (opcional):</label>
                    <input type="password" id="updatedPassword" minlength="6">
                </div>

                <div>
                    <button id="UpdateUser" type="button">Actualizar usuario</button>
                </div>
            </form> 
        </div>

        <div class="navigation">
            <button id="usersMainMenuBtn" class="nav-button">
                <img src="/images/Photoroom_20250604_174552.png" alt="Menú Principal" class="button-image">
            </button>
        </div>
    </div>
</body>
</html>
