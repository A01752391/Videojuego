<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/assets/css/users.css" rel="stylesheet">
    <script type="module" src="../js/API-integration/usersAPI.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> <!-- For pretty popups-->
    <title>PAWNED - Configuración de Usuarios</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('/images/mainbackground.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            color: white;
        }        .users-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px;
            background-color: rgba(44, 30, 46, 0.95);
            border: 2px solid #ff4081;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .unified-header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
            border-bottom: 2px solid #ff4081;
        }

        .logo-container {
            margin-bottom: 20px;
        }        .logo {
            height: 60px;
            width: auto;
            margin-bottom: 10px;
        }        .title {
            color: #ffd54f !important;
            font-size: 3em;
            font-weight: bold;
            margin: 10px 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }        /* Selector más específico para forzar el color amarillo */
        .users-container .unified-header .title,
        .users-container .title,
        h1.title {
            color: #ffd54f !important;
        }        /* Override SUPER AGRESIVO para el título */
        body .users-container .unified-header h1.title,
        body .users-container h1.title,
        body h1.title,
        .users-container .unified-header h1,
        .unified-header .title,
        #users-page h1,
        [class*="title"],
        h1 {
            color: #ffd54f !important;
            background: none !important;
            background-color: transparent !important;
            background-image: none !important;
            background-clip: unset !important;
            -webkit-background-clip: unset !important;
            -webkit-text-fill-color: #ffd54f !important;
        }

        .subtitle {
            color: #ff4081;
            font-size: 1.2em;
            margin-bottom: 10px;
            font-weight: 300;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }        .main-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            max-width: 100%;
            align-items: center;
        }

        .section {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid #ff4081;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 20px;
            backdrop-filter: blur(5px);
            width: 90%;
            max-width: 800px;
            box-sizing: border-box;
        }

        .section h2 {
            color: #ffd54f;
            font-size: 1.8em;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }        .formContainer {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 100%;
        }

        .formContainer div {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 100%;
        }

        .formContainer label {
            color: #ffffff;
            font-weight: 600;
            font-size: 1.1em;
        }

        .formContainer input {
            padding: 12px;
            border: 2px solid #ff4081;
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.9);
            color: #2c1e2e;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .formContainer input:focus {
            outline: none;
            border-color: #ffd54f;
            box-shadow: 0 0 10px rgba(255, 213, 79, 0.3);
        }        .formContainer button {
            background: linear-gradient(45deg, #ff4081, #e91e63);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            box-shadow: 0 3px 10px rgba(255, 64, 129, 0.3);
        }

        .formContainer button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 64, 129, 0.5);
            background: linear-gradient(45deg, #e91e63, #ff4081);
        }

        .users-info {
            border-color: #ffd54f;
        }

        .main-menu-btn {
            background-color: transparent;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 15px;
            padding: 10px;
        }

        .main-menu-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(255, 64, 129, 0.4);
        }

        .button-image {
            width: 140px;
            height: auto;
            border-radius: 10px;
        }        .navigation-controls {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #ff4081;
        }        /* Responsive Design */
        @media (max-width: 768px) {
            .users-container {
                max-width: 95%;
                padding: 20px;
                margin: 10px auto;
            }
            
            .section {
                padding: 20px;
                width: 95%;
            }
            
            .formContainer button {
                padding: 12px 20px;
                font-size: 1em;
            }
            
            .button-image {
                width: 120px;
            }
        }

        @media (max-width: 480px) {
            .users-container {
                padding: 15px;
            }
            
            .title {
                font-size: 2.5em !important;
            }
            
            .subtitle {
                font-size: 1em;
            }

            .section {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="users-main-container">
        <div class="unified-header">
            <div class="logo-container">
                <img src="/images/pawnedletraslogo.png" alt="PAWNED Logo" class="logo">
            </div>
            <h1 class="title">CONFIGURACIÓN</h1>
            <p class="subtitle">Gestión de usuarios de PAWNED</p>
        </div><div class="main-container">
            <div class="section">
                <h2>Registrar usuario</h2>
                <form id="formaSignUpUser" class="formContainer">
                    <div>
                        <label for="newEmail">Email:</label>
                        <input type="email" id="newEmail" required>
                    </div>

                    <div>
                        <label for="newPassword">Contraseña:</label>
                        <input type="password" id="newPassword" minlength="6" required>
                    </div>

                    <div>
                        <button id="NewUser" type="button">Registrarse</button>
                    </div>
                </form> 
            </div>
            <div class="section">
                <h2>Actualizar datos</h2>
                <form id="formaUpdateUser" class="formContainer">
                    <div>
                        <label for="currentEmail">Email actual:</label>
                        <input type="email" id="currentEmail" required>
                    </div>

                    <div>
                        <label for="currentPassword">Contraseña actual:</label>
                        <input type="password" id="currentPassword" required>
                    </div>

                    <div>
                        <label for="updatedEmail">Nuevo email (opcional):</label>
                        <input type="email" id="updatedEmail">
                    </div>

                    <div>
                        <label for="updatedPassword">Nueva contraseña (opcional):</label>
                        <input type="password" id="updatedPassword" minlength="6">
                    </div>

                    <div>
                        <button id="UpdateUser" type="button">Actualizar usuario</button>
                    </div>
                </form> 
            </div>
            <div class="section users-info">
                <h2>Usuarios registrados</h2>
                <!-- Table with registered users -->
            </div>
        </div>
        <div class="navigation-controls">
            <button id="usersMainMenuBtn" class="main-menu-btn">
                <img src="/images/Photoroom_20250604_174552.png" alt="Menú Principal" class="button-image">
            </button>        </div>
    </div>
</body>
</html>
